<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="/favicon.ico"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UNISELL — Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--navy:#090d18;--gold:#c9a84c;--gold-dim:rgba(201,168,76,0.12);--gold-border:rgba(201,168,76,0.25);--text:#e8e6e0;--text-dim:#7a7d8a;}
body{background:var(--navy);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
.container{max-width:480px;position:relative;z-index:1;}
.ring{position:fixed;border-radius:50%;border:1px solid var(--gold-border);animation:spin linear infinite;top:50%;left:50%;transform:translate(-50%,-50%);}
.ring-1{width:300px;height:300px;animation-duration:20s;}
.ring-2{width:500px;height:500px;animation-duration:35s;animation-direction:reverse;}
.icon{font-size:4rem;margin-bottom:1.5rem;animation:pulse 2s ease infinite;}
.title{font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:700;color:var(--gold);margin-bottom:0.5rem;animation:fadeUp 0.8s ease both;}
.subtitle{font-size:1rem;color:var(--text-dim);margin-bottom:2rem;line-height:1.6;animation:fadeUp 0.8s 0.1s ease both;}
.retry-btn{background:var(--gold);color:#090d18;border:none;border-radius:8px;padding:0.85rem 2rem;font-size:0.95rem;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.2s;animation:fadeUp 0.8s 0.2s ease both;}
.retry-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,168,76,0.4);}
.tips{margin-top:2rem;animation:fadeUp 0.8s 0.3s ease both;}
.tip{display:flex;align-items:center;gap:0.75rem;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:8px;padding:0.65rem 1rem;margin-bottom:0.5rem;font-size:0.83rem;color:var(--text-dim);text-align:left;}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:var(--gold);letter-spacing:0.1em;margin-bottom:2rem;animation:fadeUp 0.8s ease both;}
</style>
</head>
<body>
<div class="ring ring-1"></div>
<div class="ring ring-2"></div>
<div class="container">
  <div class="logo">UNISELL</div>
  <div class="icon">📡</div>
  <div class="title">You're Offline</div>
  <div class="subtitle">No internet connection detected.<br/>Check your connection and try again.</div>
  <button class="retry-btn" onclick="window.location.reload()">Try Again →</button>
  <div class="tips">
    <div class="tip">📶 Check your WiFi or mobile data</div>
    <div class="tip">🔄 Some pages are available offline</div>
    <div class="tip">💾 Your data is saved and will sync when reconnected</div>
  </div>
</div>
</body>
</html>
